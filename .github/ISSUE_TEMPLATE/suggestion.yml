name: "💡 콘텐츠 제안"
description: 새 섹션·확장·명확화 제안 (먼저 Discussions에서 논의하는 것을 권장)
title: "[suggestion] "
labels: ["suggestion", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        백서에 대한 제안입니다. 큰 변경 또는 토론이 필요한 아이디어는 [Discussions](../../discussions)에서 시작하는 것이 좋습니다.
  - type: textarea
    id: idea
    attributes:
      label: 제안
      description: 무엇을 추가·확장·변경하려는지
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: 이유 / 근거
      description: 왜 필요한가? 어떤 가치를 더하는가?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 영향 범위 (선택)
      description: 어느 섹션·결정에 영향을 미치는지
  - type: textarea
    id: references
    attributes:
      label: 참고 자료 (선택)
      description: 관련 논문·기사·다른 프로젝트 등
  - type: checkboxes
    id: terms
    attributes:
      label: 행동 강령
      options:
        - label: 본 저장소의 [행동 강령](../blob/main/CODE_OF_CONDUCT.md)을 읽고 준수에 동의합니다
          required: true
